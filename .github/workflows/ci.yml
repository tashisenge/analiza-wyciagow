name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analiza
          POSTGRES_PASSWORD: analiza
          POSTGRES_DB: analiza_wyciagow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analiza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://analiza:analiza@localhost:5432/analiza_wyciagow
      DIRECT_URL: postgresql://analiza:analiza@localhost:5432/analiza_wyciagow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analiza
          POSTGRES_PASSWORD: analiza
          POSTGRES_DB: analiza_wyciagow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analiza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://analiza:analiza@localhost:5432/analiza_wyciagow
      DIRECT_URL: postgresql://analiza:analiza@localhost:5432/analiza_wyciagow
      AUTH_SECRET: ci-test-secret-min-32-chars-long!!
      NEXTAUTH_URL: http://localhost:3100
      PLAYWRIGHT_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run demo:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
